<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2a3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Plateforme de gestion globale IDEAL Ecole. Outil administratif, gestion des programmes et notes." />
    <title>IDEAL EcoleApp</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(registration => registration.update())
            .catch(error => console.error('Service worker non enregistré :', error));
        });
      }

      // Une SPA déjà ouverte conserve son ancien bundle JavaScript en mémoire,
      // même après un déploiement Vercel. Toutes les 60 secondes — et dès que
      // l'utilisateur revient dans l'application — on compare le fichier JS
      // annoncé par l'index en ligne à celui actuellement exécuté. Si Vercel
      // en annonce un nouveau, un seul rechargement suffit à basculer dessus.
      (() => {
        let verificationEnCours = false;
        const assetActuel = () => document.querySelector('script[type="module"][src]')?.getAttribute('src') || '';
        const verifierVersion = async () => {
          if (verificationEnCours || document.visibilityState === 'hidden') return;
          verificationEnCours = true;
          try {
            const reponse = await fetch(`/?version=${Date.now()}`, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
            if (!reponse.ok) return;
            const html = await reponse.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const assetEnLigne = doc.querySelector('script[type="module"][src]')?.getAttribute('src') || '';
            if (assetEnLigne && assetActuel() && assetEnLigne !== assetActuel()) {
              window.location.reload();
            }
          } catch (_) {
            // Hors connexion : le service worker continue de servir le cache.
          } finally {
            verificationEnCours = false;
          }
        };
        window.addEventListener('load', verifierVersion);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') verifierVersion();
        });
        setInterval(verifierVersion, 60000);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
